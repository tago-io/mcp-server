name: Run Unit Tests

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    strategy:
      matrix:
        # 22.12.0 is the oldest supported engine (unflagged require(esm) for
        # the ESM-only dashboard-schema package); 24 matches .node-version.
        node-version: ["22.12.0", "24"]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm run linter
      - run: pnpm run format-check
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: pnpm run build
      # Proves the built CommonJS server can require() the ESM-only
      # dashboard-schema validator on this Node version.
      - run: pnpm run test:validator:node
